<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خرید زنده نان رضوی</title><script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script><style>body{font-family:Tahoma;margin:0;background:#f1f5f9;color:#17304b}header{background:#113d6b;color:#fff;text-align:center;padding:16px}main{max-width:700px;margin:auto;padding:12px}.card{background:#fff;padding:16px;margin:12px 0;border-radius:16px;box-shadow:0 2px 9px #0001}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}button{border:0;border-radius:10px;padding:13px;margin:4px;font-size:15px;font-weight:bold;background:#1468a8;color:white}button.alt{background:#e1ebf6;color:#143a60}button.red{background:#b73339;color:white}input{padding:12px;width:95%;border:1px solid #ccd7e4;border-radius:10px;font-size:16px}section{display:none}section.active{display:block}.status{padding:12px;background:#e8f3ff;border-radius:10px;margin:10px 0}.call{border:1px solid #dbe4ee;padding:12px;border-radius:12px;margin:8px 0}video{width:100%;background:#111;border-radius:10px;min-height:150px;object-fit:cover}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.small{font-size:12px;color:#64748b}</style></head><body><header><h2>🛒 خرید زنده نان رضوی</h2><div>آزمایش اتصال مشتری و کارمند · ۰.۵</div></header><main><div class="card"><div class="row"><button class="alt" onclick="modeSet('customer')">صفحه مشتری</button><button class="alt" onclick="modeSet('employee')">پنل کارمند</button></div><p class="small">برای تماس تصویری، سایت باید با HTTPS باز شده باشد و مجوز دوربین/میکروفون داده شود.</p></div><section id="customer"><div class="card"><h3>درخواست خرید زنده</h3><input id="name" placeholder="نام (اختیاری)"><button onclick="requestCall()">درخواست ارتباط با فروشگاه</button><div id="custStatus" class="status">آماده</div><div id="custCall"></div></div></section><section id="employee"><div class="card"><h3>صف درخواست مشتری</h3><div id="queue">در حال اتصال…</div><div id="empStatus" class="status">پنل کارمند</div></div></section><div id="videoArea" class="card" style="display:none"><h3>تماس تصویری</h3><div class="grid"><div><label>تصویر من</label><video id="local" autoplay playsinline muted></video></div><div><label>طرف مقابل</label><video id="remote" autoplay playsinline></video></div></div><button class="alt" onclick="toggleMic()">روشن/خاموش میکروفون</button><button class="red" onclick="endCall()">پایان تماس</button><div id="vidStatus" class="status">—</div></div></main><script>
let mode='customer', call=null, room=null, empWS=null, custWS=null, mic=true;
const api='/api';function ws(path){return (location.protocol==='https:'?'wss://':'ws://')+location.host+path}function status(id,t){document.getElementById(id).textContent=t}function modeSet(m){mode=m;document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===m));if(m==='employee')startEmployee();else if(empWS){empWS.close();empWS=null}}
async function requestCall(){status('custStatus','در حال ارسال…');try{const res=await fetch(api+'/calls',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_name:document.getElementById('name').value||'مشتری'})});if(!res.ok)throw Error();call=await res.json();status('custStatus','درخواست ارسال شد. کد: '+call.call_id+' — منتظر پذیرش');custWS=new WebSocket(ws('/ws/customer/'+call.call_id));custWS.onmessage=async e=>{let m=JSON.parse(e.data);if(m.type==='call_accepted')startVideo(m.call,'customer');if(m.type==='call_rejected')status('custStatus','درخواست رد شد');if(m.type==='call_ended'){status('custStatus','تماس پایان یافت');disconnect()}}}catch(e){status('custStatus','سرور در دسترس نیست. ابتدا پروژه باید روی HTTPS راه‌اندازی شود.')}}
function startEmployee(){if(empWS&&empWS.readyState<2)return;empWS=new WebSocket(ws('/ws/employee'));empWS.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='queue_snapshot')draw(m.calls);if(m.type==='incoming_call')refreshQueue();if(m.type==='call_accepted')refreshQueue()};empWS.onclose=()=>status('empStatus','اتصال پنل قطع شد؛ برای اتصال دوباره صفحه را باز کنید')}
async function refreshQueue(){try{let r=await fetch(api+'/calls');draw(await r.json())}catch(e){status('queue','سرور در دسترس نیست')}}function escapeHTML(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function draw(items){const el=document.getElementById('queue');if(!items?.length){el.textContent='درخواستی در صف نیست';return}el.innerHTML=items.map(c=>`<div class="call"><b>${escapeHTML(c.customer_name)}</b><p class="small">کد: ${escapeHTML(c.call_id)}</p><button onclick="accept('${c.call_id}')">پذیرش</button><button class="red" onclick="reject('${c.call_id}')">رد</button></div>`).join('')}
async function action(name,id){let r=await fetch(api+'/calls/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({call_id:id})});if(!r.ok)throw Error();return r.json()}async function accept(id){try{call=await action('accept',id);status('empStatus','پذیرفته شد؛ در حال اتصال…');startVideo(call,'employee');refreshQueue()}catch(e){status('empStatus','پذیرش ناموفق')}}async function reject(id){try{await action('reject',id);refreshQueue()}catch(e){status('empStatus','رد درخواست ناموفق')}}
async function startVideo(c,role){try{if(!window.LivekitClient)throw Error('SDK');let t=await fetch(api+'/livekit-token?room='+encodeURIComponent(c.room)+'&identity='+encodeURIComponent(role)+'&call_id='+encodeURIComponent(c.call_id)+'&role='+role);if(!t.ok)throw Error('token');let d=await t.json();room=new LivekitClient.Room({adaptiveStream:true,dynacast:true});room.on(LivekitClient.RoomEvent.TrackSubscribed,(track)=>{let el=track.attach();if(track.kind===LivekitClient.Track.Kind.Video)document.getElementById('remote').replaceWith(el);else document.body.appendChild(el)});room.on(LivekitClient.RoomEvent.TrackUnsubscribed,t=>t.detach());await room.connect(d.server_url,d.token);await room.localParticipant.setCameraEnabled(true);await room.localParticipant.setMicrophoneEnabled(true);let pub=room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);if(pub?.track)pub.track.attach(document.getElementById('local'));document.getElementById('videoArea').style.display='block';status('vidStatus','متصل؛ اگر تصویر طرف مقابل هنوز نیست منتظر بمانید');status(role==='employee'?'empStatus':'custStatus','تماس متصل شد')}catch(e){document.getElementById('videoArea').style.display='block';status('vidStatus','اتصال ناموفق. سرور، HTTPS، تنظیم LiveKit و دسترسی دوربین بررسی شود.')}}async function toggleMic(){if(!room)return;mic=!mic;await room.localParticipant.setMicrophoneEnabled(mic);status('vidStatus',mic?'میکروفون روشن':'میکروفون خاموش')}async function endCall(){if(call)try{await action('end',call.call_id)}catch(e){}disconnect()}function disconnect(){if(room){room.disconnect();room=null}document.getElementById('videoArea').style.display='none';if(custWS){custWS.close();custWS=null}}
modeSet(new URLSearchParams(location.search).get('mode')||'customer');</script></body></html>
